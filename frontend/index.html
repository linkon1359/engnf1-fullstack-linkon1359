<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriageSync - Login & Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="nav">
    <strong>TriageSync</strong>
  </nav>

  <main class="container">
    <div id="alertBox" class="status-msg"></div>

    <div class="card">
      <h2>Login</h2>
      <form id="loginForm" class="filters">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="primary">Login</button>
      </form>
    </div>

    <div class="card">
      <h2>Register (Standard User)</h2>
      <form id="registerForm" class="filters">
        <input type="text" id="regName" placeholder="Full Name (2-50 chars)" required />
        <input type="email" id="regEmail" placeholder="Email" required />
        <input type="password" id="regPassword" placeholder="Password (8+ chars, letter & digit)" required />
        <button type="submit">Register</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
